apiVersion: nais.io/v1alpha1
kind: Application
metadata:
  name: dataprodukt-forstegangsbehandling
  namespace: tbd
  labels:
    team: tbd
spec:
  port: 8080
  liveness:
    path: isalive
  readiness:
    path: isready
  resources:
    limits:
      memory: 500Mi
    requests:
      cpu: 200m
      memory: 500Mi
  replicas:
    min: 1
    max: 1
    cpuThresholdPercentage: 75
  prometheus:
    enabled: true
    path: /metrics
  env:
    - name: KAFKA_RAPID_TOPIC
      value: tbd.rapid.v1
    - name: KAFKA_CONSUMER_GROUP_ID
      value: cg-dataprodukt-forstegangsbehandling-v1
    - name: KAFKA_RESET_POLICY
      value: "earliest"
  observability:
    logging:
      destinations:
        - id: elastic
        - id: loki
